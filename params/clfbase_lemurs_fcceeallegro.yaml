
trainer:
  stage_dir: /workdir/phamt/stage_dir/results
  run_name: lemurs_fcceeallegro_baseclf
  accelerator: auto
  devices: 1
  max_epochs: 500
  precision: 32
  logger:
    - class_path: training_utils.wandb.WandbLogger
      init_args:
        stage_dir: /workdir/phamt/stage_dir/results
        project: caloxtreme_mlp
        group: caloinn_clf_base
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 3
        filename: "{epoch}-{val_loss:.2f}"
        save_last: true
        save_on_exception: true
        verbose: true
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_epochs: 50
        save_top_k: -1
        filename: "epoch{epoch:04d}"
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

data:
  class_path: lemurs_data.LEMURSDataModule
  init_args:
    data_path: /workdir/phamt/lemurs/fcceeallegro/LEMURS_FCCeeALLEGRO_training.h5
    val_data_path: /workdir/phamt/lemurs/fcceeallegro/testing/LEMURS_FCCeeALLEGRO_gamma_100kEvents_1GeV100GeV_GPSflat_part10.h5
    batch_size: 1024
    xml_path: binning_lemurs_fcceeallegro.xml
    xml_ptype: photon
    val_frac: 0.01
    eps: 1.0e-10
    u0up_cut: 1e9
    u0low_cut: 0.0
    rew: 1.0
    dep_cut: 1.0e10
    width_noise: 5.0e-6
    fixed_noise: false
    shuffle: false
    num_workers: 2
    predict_batch_size: 1000
    eval_dataset: "1-photons"
    cache_mode: none
    cache_dir: /workdir/phamt/lemurs/fcceeallegro_cache
    cache_chunk: 10000

model: 
  class_path: lightning_module.CaloINNBaseCLF
  init_args:
    hidden_dim: 1024
    num_layers: 5
    batch_norm: false
    layer_norm: true
    output_dim: 1
    dropout: 0.5
    activation: relu
    generator_ckpt_path: run/epoch=17-val_loss=9378.26.ckpt
    # optimizer and learning scheduler
    lr: 0.0001
    step_size: 10
    gamma: 0.95
    amsgrad: true
    
