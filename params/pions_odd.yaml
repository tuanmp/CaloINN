# CaloINN Lightning training config — odd-pion discrete coarse-HCAL dataset.
# Harmonized with CaloINN/params/pions_odd_discrete.yaml (all matching values).
#
# Key differences from legacy:
#   - max_samples: not needed — streaming handles any dataset size
#   - seed_everything: 2026 — legacy had no seed (non-deterministic)
#   - num_workers: 0 — required for streaming (HDF5 not fork-safe)
#   - num_workers: 4 — sharded supports multi-worker via pickle-safe handles
#   - Run with: uv run python main.py fit --config params/pions_odd.yaml

seed_everything: 2026

trainer:
  stage_dir: /pscratch/sd/p/pmtuan/caloinn
  run_name: full_training_odd_lightning
  accelerator: auto
  devices: 1
  max_epochs: 1000
  precision: 32
  logger:
    - class_path: training_utils.wandb.WandbLogger
      init_args:
        stage_dir: /pscratch/sd/p/pmtuan/caloinn
        project: caloinn_lightning
        group: full_train_odd
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 3
        filename: "{epoch}-{val_loss:.2f}"
        save_last: true
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_epochs: 50          # matches legacy save_interval: 50
        save_top_k: -1              # keep all periodic checkpoints
        filename: "epoch{epoch:04d}"
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: training_utils.actnorm_warmup.ActNormWarmupCallback
      init_args:
        enabled: true
        num_samples: 1000000
        deterministic_seed: 2026
        disable_batchnorm_updates: true
        calibration_source: module_cache

# ── Data (mirrors legacy exactly, plus use_sharded / num_workers) ──
data:
  data_path: "/pscratch/sd/p/pmtuan/ddsim/single_pion_discrete_coarse_hcal/trainset_flat_good_order.hdf5"
  val_data_path: "/pscratch/sd/p/pmtuan/ddsim/single_pion_discrete_clf_train_coarse_hcal/all_showers_flatten.h5"
  batch_size: 2048
  val_frac: 0.01
  shuffle: True             # matches legacy default (params.get("shuffle", True))
  eval_dataset: "1-pions"
  num_workers: 4
  use_sharded: true
  dataset_kwargs:
    xml_path: /global/cfs/cdirs/m3443/usr/pmtuan/caloinn_lightning/CaloINN/binning_odd_pion.xml
    xml_ptype: "pion"
    single_energy: null
    eps: 1.0e-10
    u0up_cut: 3.5
    u0low_cut: 0.0
    pt_rew: 1.0
    dep_cut: 600
    width_noise: 5.0e-6

# ── Model (mirrors legacy architecture and hyperparameters) ──
model:
  setup_data_sample_path: "/pscratch/sd/p/pmtuan/ddsim/single_pion_discrete_coarse_hcal/trainset_flat_good_order.hdf5"
  actnorm_calibration_samples: 1000000
  max_samples: 10000           # matches legacy: 1M random samples for init
  width_noise: 5.0e-6           # matches legacy
  custom_noise: False
  xml_path: /global/cfs/cdirs/m3443/usr/pmtuan/caloinn_lightning/CaloINN/binning_odd_pion.xml
  xml_ptype: "pion"
  enable_diagnostics: false
  init_from_legacy_train_split: false
  dataset_params:
    xml_ptype: "pion"
    single_energy: null
    eps: 1.0e-10                # shared preprocessing eps
    u0up_cut: 3.5               # matches legacy
    u0low_cut: 0.0
    pt_rew: 1.0
    dep_cut: 600
    eval_dataset: "1-pions"
  optimizer_params:
    lr: 0.00001                 # matches legacy lr: 1.e-5
    betas: [0.9, 0.999]        # matches legacy
    eps: 0.0000000001           # matches legacy eps: 1.0e-10 (same key)
    weight_decay: 0.01          # matches legacy
  scheduler_params:
    lr_scheduler: one_cycle_lr  # matches legacy
    max_lr: 0.0001              # matches legacy max_lr: 1.e-4
    epochs: 800                 # matches legacy cycle_epochs: 800
    steps_per_epoch: 1144       # 2,344,086 train / 2048 batch (full dataset)
  cinn_params:
    bayesian: False
    alpha: 1.0e-8               # matches legacy
    alpha_logit: 1.0e-6         # matches legacy
    use_extra_dims: True        # matches legacy
    use_norm: False             # matches legacy
    log_cond: True              # matches legacy
    layers_per_block: 4
    internal_size: 256
    n_blocks: 12
    coupling_type: rational_quadratic
    dropout: 0.0
    layer_norm: nn.BatchNorm1d  # matches legacy
    layer_act: nn.SiLU          # matches legacy
    num_bins: 10
    bounds_init: 18
    permute_soft: False
    permute_layer: False
    std_init: -15.0             # matches legacy
    prior_prec: 5000            # matches legacy
    sub_layers: [linear, linear, linear, linear]
    norm: True